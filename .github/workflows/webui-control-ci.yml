name: WebUI Control Plane CI

on:
  pull_request:
    paths:
      - "webui-control/**"
      - "webui-assets/**"
      - "openwebui/tools/**"
      - "worker/**"
      - "scripts/**"
      - "deploy/**"
      - "tests/**"
      - ".github/workflows/webui-control-ci.yml"
  push:
    branches:
      - "feature/t212-instrument-cache-v03"
    paths:
      - "webui-control/**"
      - "webui-assets/**"
      - "openwebui/tools/**"
      - "worker/**"
      - "scripts/**"
      - "deploy/**"
      - "tests/**"
      - ".github/workflows/webui-control-ci.yml"

permissions:
  contents: read

concurrency:
  group: webui-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q openwebui worker scripts tests

      - name: Run complete unit suite
        run: python -m unittest discover -s tests

      - name: Run control-plane preflight
        run: python scripts/verify_webui_control.py

      - name: Validate logical workspace runtime contract
        run: python scripts/validate_workspace_runtime_contract.py

      - name: Audit staged workspace isolation
        run: python scripts/audit_workspace_isolation.py

      - name: Build repository implementation register
        run: python scripts/build_implementation_register.py

      - name: Build repository T212 gap register
        run: python scripts/build_t212_gap_register.py

      - name: Validate empty DEMO programme register safely
        run: python scripts/build_demo_validation_status.py --ledger /tmp/nonexistent-demo-validation.jsonl

      - name: Confirm repository contains no tracked dotenv files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "Tracked dotenv file detected; refusing validation."
            exit 1
          fi
